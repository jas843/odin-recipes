    <title>Chicken Adobo</title>

  <body>
    <header>
      <h1>Chicken Adobo</h1>
      <a href="../index.html">Back to Home</a>
    </header>
    <main>
      <article>
        <p>A classic Filipino dish of chicken simmered in soy sauce and vinegar.</p>
        <h2>Ingredients</h2>
        <ul>
          <li>1 kg chicken</li>
          <li>1/2 cup soy sauce</li>
          <li>1/4 cup vinegar</li>
        </ul>
        <h2>Steps</h2>
        <ol>
          <li>Combine all ingredients in a pot.</li>
          <li>Simmer until the chicken is tender.</li>
        </ol>
      </article>
    </main>
  </body>
