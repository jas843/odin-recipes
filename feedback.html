<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - Odin Recipes</title>
  </head>
  <body>
    <header>
      <h1>Feedback</h1>
      <a href="index.html">Back to Home</a>
    </header>
    <main>
      <section>
        <h2>Tell us what you think</h2>
        <form action="#" method="post">
          <p>
            <label for="name">Name:</label><br />
            <input type="text" id="name" name="name" required />
          </p>
          <p>
            <label for="email">Email:</label><br />
            <input type="email" id="email" name="email" required />
          </p>
          <p>
            <label for="recipe">Favorite recipe:</label><br />
            <select id="recipe" name="recipe">
              <option value="adobo">Chicken Adobo</option>
              <option value="sinigang">Pork Sinigang</option>
              <option value="pancit">Pancit Canton</option>
            </select>
          </p>
          <fieldset>
            <legend>Rating:</legend>
            <input type="radio" id="r1" name="rating" value="1" />
            <label for="r1">1</label>
            <input type="radio" id="r2" name="rating" value="2" />
            <label for="r2">2</label>
            <input type="radio" id="r3" name="rating" value="3" />
            <label for="r3">3</label>
            <input type="radio" id="r4" name="rating" value="4" />
            <label for="r4">4</label>
            <input type="radio" id="r5" name="rating" value="5" />
            <label for="r5">5</label>
          </fieldset>
          <p>
            <label for="message">Comments:</label><br />
            <textarea id="message" name="message" rows="5" cols="40"></textarea>
          </p>
          <button type="submit">Send Feedback</button>
        </form>
      </section>
    </main>
  </body>
</html>
